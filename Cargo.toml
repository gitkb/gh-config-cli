[package]
name = "gh-config"
version = "1.3.0"
edition = "2021"
repository = "https://github.com/gitkb/gh-config-cli"
homepage = "https://github.com/gitkb/gh-config-cli"
documentation = "https://docs.rs/gh-config"
keywords = ["cli", "context", "ai", "rust", "project", "tool"]
authors = ["@mateodelnorte"]

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "forbid"
unconditional_recursion = "forbid"

# Non-test code must not panic. Tests may (clippy.toml).
[lints.clippy]
suspicious = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
unused_result_ok = "deny"
let_underscore_must_use = "deny"
let_underscore_future = "deny"
await_holding_lock = "deny"

[[bin]]
name = "gh-config"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.98"
axum = { version = "0.8", default-features = false, features = ["http1", "query", "tokio"] }
clap = { version = "4.5.36", features = ["derive", "env"] }
colored = "3.0.0"
env_logger = "0.11.8"
log = "0.4"
getrandom = "0.3"
openssl-sys = { version = "0.9.106", optional = true }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_path_to_error = "0.1"
serde_yaml = "0.9"
similar = "2.6"
thiserror = "1.0"
tokio = { version = "1.44.2", features = ["full"] }

[dev-dependencies]
mockito = "1.7.0"
tempfile = "3.19.1"

[features]
vendored = ["openssl-sys/vendored"]
default = []
