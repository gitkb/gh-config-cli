name: Validate main and release its declared version
on:
  push:
    branches:
    - main

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/quality.yaml
  tag:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag a new Cargo package version
        id: version
        run: |
          version=$(sed -n 's/^version = "\([0-9.]*\)"$/\1/p' Cargo.toml)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git rev-parse --verify "refs/tags/$tag" >/dev/null 2>&1; then
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          else
            git tag "$tag"
            git push origin "$tag"
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          fi
  release:
    needs: tag
    if: needs.tag.outputs.publish == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/on-v-tag-release.yaml
    with:
      ref: ${{ needs.tag.outputs.tag }}
